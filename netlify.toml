[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: always serve index.html so refreshing never gives a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache images and videos for a week so repeat visits are fast.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
